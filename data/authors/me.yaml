bio: |
  Chemist and PhD candidate in Computational Chemistry at the Universitat Autònoma de Barcelona (InSiliChem group).
  My doctoral research focuses on the rational design of artificial metalloenzymes and de novo metallopeptides for
  biocatalysis and drug design through molecular dynamics, structure prediction, and mechanistic modelling.
  I develop open-source Python tools to automate and deepen simulation analysis, integrating machine learning and AI models.

