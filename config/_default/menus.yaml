# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the id/filename.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Conferences
    url: /#conferences
    weight: 20
  - name: Projects
    url: projects/
    weight: 30
  - name: Services
    url: services/
    weight: 40
  - name: Blog
    url: blog/
    weight: 50
  - name: CV
    url: cv/
    weight: 60
